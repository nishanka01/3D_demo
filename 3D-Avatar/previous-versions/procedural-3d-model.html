<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --glass: rgba(20, 24, 40, 0.55); --line: rgba(255,255,255,0.14); --ink: #f5f1ea; --accent: #7fd1c2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1511; font-family: 'Outfit', system-ui, sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .chip { position: fixed; top: 16px; left: 16px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-weight: 500; font-size: 14px; letter-spacing: .2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #5be38f; box-shadow: 0 0 0 0 rgba(91,227,143,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(91,227,143,.55);} 70% { box-shadow: 0 0 0 9px rgba(91,227,143,0);} 100% { box-shadow: 0 0 0 0 rgba(91,227,143,0);} }
  .hint { position: fixed; top: 18px; right: 16px; font-size: 12.5px; opacity: .75; padding: 7px 12px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .toolbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; padding: 7px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar .sep { width: 1px; background: var(--line); margin: 6px 3px; flex: none; }
  button { font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 12px; padding: 8px 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 58px; flex: none; transition: background .15s, transform .1s; }
  button:hover { background: rgba(255,255,255,0.09); }
  button:active { transform: scale(.95); }
  button .e { font-size: 20px; line-height: 1.1; }
  button .l { font-size: 11.5px; opacity: .85; white-space: nowrap; }
  button.on { background: rgba(127, 209, 194, 0.22); box-shadow: inset 0 0 0 1px rgba(127,209,194,.45); }
  #bubble { position: fixed; pointer-events: none; padding: 10px 15px; border-radius: 16px; background: #fffaf3; color: #2b2320; font-weight: 500; font-size: 15px; box-shadow: 0 8px 30px rgba(0,0,0,.25); opacity: 0; transform: translate(0, 8px) scale(.96); transition: opacity .2s, transform .2s; max-width: 240px; }
  #bubble.show { opacity: 1; transform: translate(0,0) scale(1); }
  #bubble::after { content: ""; position: absolute; left: 16px; bottom: -8px; border: 9px solid transparent; border-top-color: #fffaf3; border-bottom: 0; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1b1511; font-size: 15px; letter-spacing: .3px; transition: opacity .5s; z-index: 5; }
  #loading.hide { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { .hint { display: none; } button { min-width: 52px; padding: 7px 8px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading">Building your avatar…</div>
<div class="chip"><span class="dot"></span>3D Avatar · live</div>
<div class="hint">Drag to orbit · Scroll to zoom · Tap her to react</div>
<div id="bubble"></div>
<div class="toolbar" id="toolbar">
  <button data-act="smile"><span class="e">🙂</span><span class="l">Smile</span></button>
  <button data-act="laugh"><span class="e">😄</span><span class="l">Laugh</span></button>
  <button data-act="surprise"><span class="e">😮</span><span class="l">Surprise</span></button>
  <button data-act="wink"><span class="e">😉</span><span class="l">Wink</span></button>
  <button data-act="blink"><span class="e">😌</span><span class="l">Blink</span></button>
  <button data-act="talk"><span class="e">💬</span><span class="l">Say hi</span></button>
  <button data-act="nod"><span class="e">👍</span><span class="l">Nod</span></button>
  <button data-act="shake"><span class="e">🙅‍♀️</span><span class="l">No</span></button>
  <div class="sep"></div>
  <button data-toggle="follow" class="on"><span class="e">👀</span><span class="l">Follow</span></button>
  <button data-toggle="spin"><span class="e">🔄</span><span class="l">Rotate</span></button>
  <button data-act="reset"><span class="e">🎯</span><span class="l">Reset</span></button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3, V2 = THREE.Vector2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(11);
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const smoothstep = (e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('loading').textContent = 'This device or browser does not support WebGL, so the 3D avatar cannot be shown.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241a14);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 0.05, 60);
const HOME_TARGET = new V3(0, 1.2, 0);
function homeCamPos(){ const a = innerWidth/innerHeight; const d = a < 1 ? 4.3 / Math.max(a,0.45) * 0.62 : 4.3; return new V3(0, 1.45, d); }
camera.position.copy(homeCamPos());
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 1.2; controls.maxDistance = 7;
controls.minPolarAngle = 0.75; controls.maxPolarAngle = 1.9;
controls.minAzimuthAngle = -1.35; controls.maxAzimuthAngle = 1.35;
controls.autoRotateSpeed = 1.2;
controls.update();

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xfff2e4, 0x3b2a1e, 0.55));
const key = new THREE.DirectionalLight(0xfff0de, 1.9);
key.position.set(-2.2, 3.6, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.6; key.shadow.camera.right = 1.6; key.shadow.camera.top = 1.6; key.shadow.camera.bottom = -1.2;
key.shadow.camera.near = 1; key.shadow.camera.far = 12;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
key.target.position.set(0, 1.1, 0);
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xdfe7ff, 0.65); fill.position.set(3, 1.6, 3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffdcb8, 1.8); rim.position.set(1.8, 3.2, -3.5); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xc8d4ff, 0.9); rim2.position.set(-2.2, 2.6, -3); scene.add(rim2);

/* ---------------- texture helpers ---------------- */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c, {srgb=true, repeat=null, rot=0} = {}){
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  if (rot){ t.center.set(.5,.5); t.rotation = rot; }
  return t;
}
function woodCanvas(w, h, base, darkRGB, seed, lines=160){
  const c = makeCanvas(w,h), g = c.getContext('2d'); const r = mulberry32(seed);
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for (let i=0;i<lines;i++){
    g.strokeStyle = `rgba(${darkRGB},${0.03 + r()*0.12})`;
    g.lineWidth = 0.6 + r()*2.4;
    const y0 = r()*h, amp = 2 + r()*6, fr = 0.004 + r()*0.01, ph = r()*6.28;
    g.beginPath();
    for (let x=0;x<=w;x+=6) g.lineTo(x, y0 + Math.sin(x*fr+ph)*amp + Math.sin(x*fr*3.1+ph*2)*amp*0.3);
    g.stroke();
  }
  return c;
}
function fabricCanvas(w,h,base,seed,amt=18){
  const c = makeCanvas(w,h), g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0,0,w,h);
  const img = g.getImageData(0,0,w,h), d = img.data, r = mulberry32(seed);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=(y*w+x)*4; const n = (r()-0.5)*amt + ((x+y)%4<2?4:-4) + ((x-y+999)%4<2?3:-3);
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  g.putImageData(img,0,0); return c;
}
function stripeCanvas(w,h,period=14,width=3,vertical=true){
  const c = makeCanvas(w,h), g = c.getContext('2d'); g.fillStyle = '#f5f5f7'; g.fillRect(0,0,w,h);
  g.fillStyle = '#868a96';
  for (let p=0; p<(vertical?w:h); p+=period){ if (vertical) g.fillRect(p,0,width,h); else g.fillRect(0,p,w,width); }
  return c;
}
function radialCanvas(size, stops){
  const c = makeCanvas(size,size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(([o,col])=>gr.addColorStop(o,col)); g.fillStyle = gr; g.fillRect(0,0,size,size); return c;
}

/* ---------------- materials ---------------- */
const SKIN = 0xf0c0a4;
const skinMat = new THREE.MeshPhysicalMaterial({ color: SKIN, roughness: 0.52, sheen: 0.35, sheenColor: new THREE.Color(0xffc9b5), sheenRoughness: 0.5, emissive: 0x3a1508, emissiveIntensity: 0.12 });
const faceSkinMat = skinMat.clone(); faceSkinMat.vertexColors = true; faceSkinMat.color.set(0xffffff);
const lidMat = skinMat.clone(); lidMat.color.set(SKIN);
const fabricTex = toTex(fabricCanvas(256,256,'#1f2a4a',3,22), {repeat:[6,6]});
const navyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: fabricTex, roughness: 0.82, envMapIntensity: 0.5 });
const stripeTex = toTex(stripeCanvas(256,256,16,4,true), {repeat:[2,1]});
const shirtMat = new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.7, side: THREE.DoubleSide });
const silverMat = new THREE.MeshStandardMaterial({ color: 0xe9ecf2, metalness: 1, roughness: 0.18 });
const pearlMat = new THREE.MeshPhysicalMaterial({ color: 0xfaf6f0, roughness: 0.2, clearcoat: 1, sheen: 1, sheenColor: new THREE.Color(0xffe8f0) });

/* ---------------- groups ---------------- */
const world = new THREE.Group(); scene.add(world);
const upper = new THREE.Group(); world.add(upper);          // torso + neck + head + hair (breathes)
const PIVOT = new V3(0, 1.385, 0);
const headGroup = new THREE.Group(); headGroup.position.copy(PIVOT); upper.add(headGroup);
const FACE_OFF = new V3(0, 0.35, 0);
const faceGroup = new THREE.Group(); faceGroup.position.copy(FACE_OFF); headGroup.add(faceGroup);
const K = 1.1; faceGroup.scale.setScalar(K);
const HC = PIVOT.clone().add(FACE_OFF);                     // head centre in "upper" space

/* ---------------- head ---------------- */
const HA = 0.287, HB = 0.305, HCZ = 0.285;
const fY = Y => Y < 0 ? 1 - 0.24*Y*Y : 1 - 0.04*Y*Y;
const gY = Y => Y < 0 ? 1 - 0.12*Y*Y : 1;
function headZ(x, y){ // front surface z of the head at local face coords
  const Y = y/HB; if (Math.abs(Y) >= 1) return 0;
  const X = x/(HA*fY(Y)); const r2 = 1 - X*X - Y*Y; if (r2 <= 0) return 0;
  return HCZ*Math.sqrt(r2)*gY(Y);
}
const EYE_R = 0.094, LID_R = 0.0968, EYE_ZS = 0.72;
const EYE_OPEN_U = 0.40, EYE_OPEN_L = 0.62, TILT_U = 0.10, TILT_L = 0.06;
const EYE_C = [-1,1].map(s => { const ex = s*0.118, ey = -0.004; return new V3(ex, ey, headZ(ex, ey) - 0.0517); });
const smax = (a,b,k) => { const h = Math.max(k - Math.abs(a-b), 0)/k; return Math.max(a,b) + h*h*k*0.25; };
function eyeOpening(s, x, y){ // signed "inside-ness" of the eye opening (positive = inside)
  const C = EYE_C[s<0?0:1]; const dx = x - C.x, dy = y - C.y; const W = 0.064;
  const q = Math.max(0, 1 - (dx/W)**2);
  const top = Math.sin(EYE_OPEN_U)*Math.sqrt(Math.max(0, LID_R*LID_R - dx*dx)) * Math.pow(q, 0.42) - s*TILT_U*dx;
  const bot = -Math.sin(EYE_OPEN_L)*Math.sqrt(Math.max(0, LID_R*LID_R - dx*dx)) * Math.pow(q, 0.5) - s*TILT_L*dx;
  return Math.min(top - dy, dy - bot, W - Math.abs(dx));
}
{
  let g = new THREE.SphereGeometry(1, 360, 270);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g);
  const p = g.attributes.position, col = new Float32Array(p.count*3);
  const shadowC = new THREE.Color(0xc98f86), base = new THREE.Color(SKIN), blush = new THREE.Color(0xf2898a), lipish = new THREE.Color(0xeeaaa0), c = new THREE.Color();
  for (let i=0;i<p.count;i++){
    const X=p.getX(i), Y=p.getY(i), Z=p.getZ(i);
    const x = HA*X*fY(Y), y = HB*Y; let z = HCZ*Z*gY(Y);
    c.copy(base);
    if (z > 0.1) for (const s of [-1,1]){
      const C = EYE_C[s<0?0:1]; const dx = x-C.x, dy = y-C.y; const r2 = LID_R*LID_R - dx*dx - dy*dy;
      if (r2 > -0.003){
        const zl = C.z + EYE_ZS*Math.sqrt(Math.max(0, r2)) + 0.0016;
        const crease = eyeOpening(s, x, y);
        const wc = 1;
        const cover = lerp(z, smax(z, zl, 0.026), wc);
        const re2 = EYE_R*EYE_R - dx*dx - dy*dy;
        const zin = re2 > 0 ? Math.min(z, C.z + EYE_ZS*Math.sqrt(re2) - 0.003) : z;
        const inside = smoothstep(-0.002, 0.006, crease);
        z = lerp(cover, zin, inside);
        c.lerp(shadowC, 0.35*Math.exp(-(((crease+0.012)/0.008)**2)) * (dy > 0 ? 1 : 0));
      }
    }
    p.setXYZ(i, x, y, z);
    if (z > 0){
      for (const s of [-1,1]){
        const dx = x - s*0.152, dy = y + 0.088; const w = Math.exp(-(dx*dx+dy*dy)/(2*0.046*0.046));
        c.lerp(blush, w*0.6);
      }
      const nx = x, ny = y + 0.118; c.lerp(lipish, Math.exp(-(nx*nx+ny*ny)/(2*0.02*0.02))*0.35);
    }
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  var headMesh = new THREE.Mesh(g, faceSkinMat);
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  faceGroup.add(headMesh);
}
// neck
{
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.078, 0.36, 40), skinMat);
  neck.position.set(0, 1.45, -0.01); neck.castShadow = true; neck.receiveShadow = true; upper.add(neck);
}
// ears (mostly hidden) + earrings
for (const s of [-1,1]){
  const ear = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 16), skinMat);
  ear.scale.set(0.45, 1, 0.8); ear.position.set(s*0.28, -0.035, 0.0); faceGroup.add(ear);
  const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.0085, 16, 12), pearlMat);
  pearl.position.set(s*0.282, -0.08, 0.03); faceGroup.add(pearl);
}

/* ---------------- eyes ---------------- */
function eyeCanvas(){
  const W=1024, H=512, c = makeCanvas(W,H), g = c.getContext('2d');
  g.fillStyle = '#fbf8f6'; g.fillRect(0,0,W,H);
  const cx=W/2, cy=H/2, px = W/(2*Math.PI);
  const R = 0.52*px, P = 0.23*px;
  // soft shadow around iris
  let gr = g.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.5); gr.addColorStop(0,'rgba(120,90,80,0.25)'); gr.addColorStop(1,'rgba(120,90,80,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,R*1.5,0,7); g.fill();
  gr = g.createRadialGradient(cx,cy,P*0.8,cx,cy,R);
  gr.addColorStop(0,'#9a6a3e'); gr.addColorStop(0.45,'#7a4a26'); gr.addColorStop(0.85,'#4a2a16'); gr.addColorStop(1,'#24140c');
  g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
  const r = mulberry32(5);
  for (let i=0;i<260;i++){ const a=r()*Math.PI*2, l0=P*1.05, l1=R*(0.75+r()*0.22);
    g.strokeStyle = r()<0.5 ? `rgba(200,150,95,${0.15+r()*0.25})` : `rgba(40,20,10,${0.15+r()*0.25})`; g.lineWidth = 1+r()*1.5;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*l0, cy+Math.sin(a)*l0); g.lineTo(cx+Math.cos(a+0.05)*l1, cy+Math.sin(a+0.05)*l1); g.stroke(); }
  g.strokeStyle = 'rgba(20,10,5,0.9)'; g.lineWidth = 6; g.beginPath(); g.arc(cx,cy,R-3,0,7); g.stroke();
  g.fillStyle = '#080606'; g.beginPath(); g.arc(cx,cy,P,0,7); g.fill();
  return c;
}
const eyeTex = toTex(eyeCanvas());
const eyeMat = new THREE.MeshPhysicalMaterial({ map: eyeTex, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.04, emissive: 0xffffff, emissiveMap: eyeTex, emissiveIntensity: 0.12 });
const lashMat = new THREE.MeshStandardMaterial({ color: 0x150e0c, roughness: 0.6 });
const hiMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const eyes = [];
for (const s of [-1, 1]){
  const center = EYE_C[s<0?0:1].clone();
  const root = new THREE.Group(); root.position.copy(center); root.scale.z = EYE_ZS; faceGroup.add(root);
  const pivot = new THREE.Group(); pivot.rotation.order = 'YXZ'; root.add(pivot);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(EYE_R, 64, 40), eyeMat); ball.rotation.y = -Math.PI/2; pivot.add(ball);
  // highlights (fixed relative to the head, like a reflection of the room)
  const hd = new V3(-0.26, 0.07, 0.96).normalize();
  const h1 = new THREE.Mesh(new THREE.SphereGeometry(0.0115, 16, 12), hiMat); h1.position.copy(hd).multiplyScalar(EYE_R*0.995); h1.lookAt(h1.position.clone().add(hd)); h1.scale.z = 0.3; root.add(h1); var hiA = h1;
  const hd2 = new V3(0.22, -0.2, 0.95).normalize();
  const h2 = new THREE.Mesh(new THREE.SphereGeometry(0.0052, 12, 10), hiMat); h2.position.copy(hd2).multiplyScalar(EYE_R*0.998); h2.lookAt(h2.position.clone().add(hd2)); h2.scale.z = 0.3; root.add(h2); var hiB = h2;
  // lids
  const tiltU = new THREE.Group(); tiltU.rotation.z = -s*TILT_U; root.add(tiltU);
  const upperLid = new THREE.Group(); tiltU.add(upperLid);
  const ul = new THREE.Mesh(new THREE.SphereGeometry(LID_R, 48, 10, 0, Math.PI*2, Math.PI/2-0.8, 0.8), lidMat); ul.castShadow = true; upperLid.add(ul);
  const lash = new THREE.Mesh(new THREE.TorusGeometry(LID_R, 0.0052, 8, 48, Math.PI), lashMat); lash.rotation.x = Math.PI/2; upperLid.add(lash);
  for (let k=0;k<7;k++){
    const t = k/6; const ang = s>0 ? lerp(0.12, 0.95, t) : Math.PI - lerp(0.12, 0.95, t);
    const pos = new V3(Math.cos(ang)*LID_R, 0, Math.sin(ang)*LID_R);
    const radial = pos.clone().normalize();
    const dir = radial.clone().multiplyScalar(0.9 + t*0.8).add(new V3(0, 0.55 + t*0.2, 0)).normalize();
    const len = 0.013 + t*0.014;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.0026, len, 6), lashMat);
    cone.position.copy(pos).addScaledVector(dir, len*0.5);
    cone.quaternion.setFromUnitVectors(new V3(0,1,0), dir);

  }

class Strip {
  constructor(n, m, mat){
    this.n=n; this.m=m;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((n+1)*(m+1)*3),3));
    const idx=[]; for(let i=0;i<n;i++) for(let j=0;j<m;j++){ const a=i*(m+1)+j, b=a+1, c=a+m+1, d=c+1; idx.push(a,c,b, b,c,d); }
    g.setIndex(idx); this.geo = g; this.mesh = new THREE.Mesh(g, mat);
  }
  update(fn){ // fn(u,v) -> [x,y,z]
    const p = this.geo.attributes.position; let k=0;
    for(let i=0;i<=this.n;i++) for(let j=0;j<=this.m;j++){ const r = fn(i/this.n, j/this.m); p.setXYZ(k++, r[0], r[1], r[2]); }
    p.needsUpdate = true; this.geo.computeVertexNormals(); this.geo.computeBoundingSphere();
  }
}

function buildBrows(){

function buildMouth(talkOpen){

const clock = new THREE.Clock();
const tmpV = new V3(), lookW = new V3();
function blinkCurve(t){ if (t < 0) return 0; if (t < 0.075) return t/0.075; if (t < 0.12) return 1; if (t < 0.27) return 1 - (t-0.12)/0.15; return 0; }
function envelope(t, dur){ if (t < 0 || t > dur) return 0; return Math.sin(Math.PI*t/dur); }

function tick(){
  let dt = Math.min(clock.getDelta(), 0.05); if (window.__freeze) dt = 0; tNow += dt;
  controls.update();

  // smooth face params
  const kf = 1 - Math.exp(-dt*10);
  for (const k in F) F[k] = lerp(F[k], FT[k], kf);

  // blinking
  if (anim.blink < 0 && tNow > anim.nextBlink){ anim.blink = tNow; anim.blinkDouble = Math.random() < 0.18; anim.nextBlink = tNow + 2.2 + Math.random()*3.8; }
  let bc = 0;
  if (anim.blink >= 0){ const t = tNow - anim.blink; bc = blinkCurve(t); if (anim.blinkDouble && t > 0.27) bc = blinkCurve(t - 0.3); if (t > (anim.blinkDouble ? 0.6 : 0.3)) anim.blink = -1; }
  let wk = 0; if (anim.wink >= 0){ const t = tNow - anim.wink; wk = t < 0.1 ? t/0.1 : t < 0.45 ? 1 : t < 0.6 ? 1-(t-0.45)/0.15 : 0; if (t > 0.6) anim.wink = -1; }

  // where to look
  if (ui.follow && pointer.active && performance.now() - pointer.last < 4000){
    ray.setFromCamera(pointer.ndc, camera);
    const dist = camera.position.distanceTo(tmpV.copy(HC)) - 0.9;
    lookW.copy(ray.ray.origin).addScaledVector(ray.ray.direction, Math.max(0.6, dist));
  } else {
    if (tNow > nextSaccade){ saccade.set((Math.random()-0.5)*0.35, (Math.random()-0.5)*0.18); if (Math.random()<0.5) saccade.set(0,0); nextSaccade = tNow + 1.2 + Math.random()*2.5; }
    lookW.copy(camera.position).add(new V3(saccade.x, saccade.y, 0));
  }
  // head orientation toward target (in upper space)
  const lu = upper.worldToLocal(lookW.clone()).sub(HC);
  let yawT = Math.atan2(lu.x, lu.z), pitchT = Math.atan2(lu.y, Math.hypot(lu.x, lu.z));
  const hy = clamp(yawT*0.45, -0.42, 0.42), hp = clamp(pitchT*0.4, -0.18, 0.2);
  const kh = 1 - Math.exp(-dt*3.2);
  head.yaw = lerp(head.yaw, hy, kh); head.pitch = lerp(head.pitch, hp, kh);
  let addPitch = 0, addYaw = 0, addRoll = 0;
  if (anim.nod >= 0){ const t = tNow - anim.nod; addPitch -= 0.16*Math.sin(t*Math.PI*2*1.7)*envelope(t, 1.2); if (t > 1.2) anim.nod = -1; }
  if (anim.shake >= 0){ const t = tNow - anim.shake; addYaw += 0.2*Math.sin(t*Math.PI*2*2.0)*envelope(t, 1.1); if (t > 1.1) anim.shake = -1; }
  if (anim.bob >= 0){ const t = tNow - anim.bob; addPitch += 0.05*Math.sin(t*Math.PI*2*4)*envelope(t,1.4); addRoll += 0.06*envelope(t,1.4); if (t > 1.4) anim.bob = -1; }
  const idleYaw = 0.03*Math.sin(tNow*0.45) + 0.015*Math.sin(tNow*1.1);
  const idleRoll = 0.035*Math.sin(tNow*0.33 + 1) + 0.04;
  headGroup.rotation.set(-(head.pitch + addPitch) + 0.02*Math.sin(tNow*0.6), head.yaw + addYaw + idleYaw, idleRoll + addRoll + F.wide*0, 'YXZ');

  // breathing
  const br = Math.sin(tNow*1.55);
  upper.position.y = 0.0035*br;
  torsoMesh.scale.set(1 + 0.006*br, 1, 1 + 0.01*br);
  upper.updateMatrixWorld(true);
  hairUniforms.uHead.value.copy(headGroup.matrix).multiply(pivotInv);
  hairUniforms.uTime.value = tNow;

  // eyes
  const lf = faceGroup.worldToLocal(lookW.clone());
  for (const e of eyes){
    const d = lf.clone().sub(e.center);
    const yaw = clamp(Math.atan2(d.x, d.z), -0.42, 0.42), pitch = clamp(Math.atan2(d.y, Math.hypot(d.x, d.z)), -0.3, 0.3);
    e.pivot.rotation.set(-pitch, yaw, 0);
    const close = Math.max(bc, (e.s < 0 ? wk : wk*0.25));
    const openU = -EYE_OPEN_U - 0.2*F.wide + 0.30*F.squint - pitch*0.55;
    const openL = EYE_OPEN_L - 0.26*F.squint - 0.06*F.wide - pitch*0.2;
    e.upperLid.rotation.x = lerp(openU, 0.17, close);
    e.lowerLid.rotation.x = lerp(openL, 0.12, close*0.9);
    for (const h of e.his) h.visible = close < 0.55;
  }
  // mouth
  let talkOpen = 0;
  if (anim.talk >= 0){ const t = tNow - anim.talk; if (t < anim.talkDur){ talkOpen = (0.18 + 0.5*Math.abs(Math.sin(t*13)*Math.sin(t*4.7 + 1)))*smoothstep(0, 0.1, t)*smoothstep(anim.talkDur, anim.talkDur-0.15, t); } else anim.talk = -1; }
  buildBrows(); buildMouth(talkOpen);

  // speech bubble placement
  if (bubble.classList.contains('show')){
    const p = HC.clone().add(new V3(0.22, 0.3, 0)); upper.localToWorld(p); p.project(camera);
    bubble.style.left = ((p.x*0.5+0.5)*innerWidth) + 'px'; bubble.style.top = ((-p.y*0.5+0.5)*innerHeight - bubble.offsetHeight) + 'px';
  }
  renderer.render(scene, camera);
  if (!window.__stop) requestAnimationFrame(tick);
}
buildBrows(); buildMouth(0);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(tick);
setTimeout(() => document.getElementById('loading').classList.add('hide'), 150);
setTimeout(() => say("Hi there! 👋"), 1400);
window.__ready = true;
window.__dbg = { camera, controls, act, F, FT, PRESETS, anim, eyes, get t(){ return tNow; }, set t(v){ tNow = v; } };
</script>
</body>
</html>
