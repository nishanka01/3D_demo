    bot: [[751,471],[738,471.5],[720,471],[702,469.5],[686,466.5],[672,462],[661,455.5],[652,448.5],[644,441]], outer: 'left' },

    top: [[852,470],[855,460],[860,449],[867,439],[877,430],[890,422],[905,419],[920,420.5],[934,425],[946,431],[953,436],[957,441]],

function interp(poly, x){ // y at x along a polyline sorted by x (either direction)

    const half = Math.sqrt(R*R - dy*dy); const xl = Math.floor(E.iris[0]-half-bx) - 1, xr = Math.ceil(E.iris[0]+half-bx) + 1;

  const cc = E.clean.getContext('2d'); const cd = cc.createImageData(bw,bh);

  else { if (t > nextSac){ sac = Math.random() < 0.7 ? { x: 0, y: 0 } : { x: (Math.random()-0.5)*0.6, y: (Math.random()-0.5)*0.3 }; nextSac = t + 1.6 + Math.random()*3; } tx = sac.x; ty = sac.y; }
  const ke = 1 - Math.exp(-dt*18), kh = 1 - Math.exp(-dt*3.5);
  st.gx = lerp(st.gx, tx*7, ke); st.gy = lerp(st.gy, ty*3.6 - Math.abs(tx)*0.5, ke);
  st.tx = lerp(st.tx, tx, kh); st.ty = lerp(st.ty, ty, kh);

  // ---- head: turns in 3D toward what she is looking at
  let yaw = st.tx*0.16, pitch = st.ty*0.07, roll = -st.tx*0.02;
  if (anim.nod >= 0){ const x = t - anim.nod; pitch += 0.09*Math.sin(x*Math.PI*2*1.6)*env(x,1.25); if (x > 1.25) anim.nod = -1; }
  if (anim.shake >= 0){ const x = t - anim.shake; yaw += 0.13*Math.sin(x*Math.PI*2*2)*env(x,1.1); if (x > 1.1) anim.shake = -1; }
  yaw += 0.02*Math.sin(t*0.5); roll += 0.012*Math.sin(t*0.37+1); pitch += 0.008*Math.sin(t*0.8);
  headQ.setFromEuler(new THREE.Euler(pitch, yaw, roll, 'YXZ'));
  headM.makeTranslation(NECK.x, NECK.y, NECK.z).multiply(tmpM.makeRotationFromQuaternion(headQ)).multiply(tmpM.makeTranslation(-NECK.x, -NECK.y, -NECK.z));
  headU.uHead.value.copy(headM);
  headU.uHeadN.value.setFromMatrix4(tmpM.makeRotationFromQuaternion(headQ));
  headU.uBreath.value = 0.003*Math.sin(t*1.5);
  headU.uTime.value = t;

  // ---- eyes texture
  let mo = 0;
  if (anim.talk >= 0){ const x = t - anim.talk; if (x > anim.talkDur) anim.talk = -1;
    for (const [s0, d, amp] of anim.syl){ const u = (x - s0)/d; if (u > 0 && u < 1) mo = Math.max(mo, amp*Math.sin(Math.PI*u)**0.8); } }
  st.mo = lerp(st.mo || 0, mo*15, 1 - Math.exp(-dt*28));
  const bL = Math.max(bc, wk), bR = bc;
  const key = [st.gx.toFixed(2), st.gy.toFixed(2), bL.toFixed(3), bR.toFixed(3), st.mo.toFixed(1)].join();
  if (key !== lastEye){ lastEye = key; drawEye(EYES[0], st.gx, st.gy, bL); drawEye(EYES[1], st.gx, st.gy, bR); drawMouth(st.mo); eyeTex.needsUpdate = true; }

  if (bubble.classList.contains('show')){
    const p = new V3(...unproject(980, 250, 0.0)).applyMatrix4(headM).project(camera);
    const bx = (p.x*0.5+0.5)*innerWidth, by = (-p.y*0.5+0.5)*innerHeight - bubble.offsetHeight - 6;
    bubble.style.left = clamp(bx, 12, Math.max(12, innerWidth - bubble.offsetWidth - 12)) + 'px';   // keep it on screen on narrow phones
    bubble.style.top = Math.max(60, by) + 'px';
  }
  renderer.render(scene, camera);
  if (!window.__stop) requestAnimationFrame(frame);
}
drawEye(EYES[0], 0, 0, 0); drawEye(EYES[1], 0, 0, 0); drawMouth(0);
requestAnimationFrame(frame);
setTimeout(() => document.getElementById('loading').classList.add('hide'), 200);
setTimeout(() => say("Hi there! 👋"), 1500);
window.__dbg = { act, anim, st, drawMouth, say, get t(){ return t; }, set t(v){ t = v; }, drawEye, EYES, eyeCanvas };
</script>
